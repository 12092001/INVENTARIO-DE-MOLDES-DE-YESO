<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1b2d">
<title>Inventario de Moldes</title>
<style>
:root{
  --bg:#eef2f7; --bg2:#e3e9f1; --card:#ffffff; --ink:#132033; --ink2:#4a5a70; --faint:#8593a6; --line:#d8e0ea; --line2:#c5d0dd;
  --brand:#1d5fd0; --brand2:#e8f0ff; --brandInk:#ffffff; --head:#0f1b2d; --headInk:#ffffff;
  --ok:#1f9d55; --okBg:#e3f6ea; --prec:#e8890c; --precBg:#fff1dc; --crit:#e03b2f; --critBg:#fde6e3; --venc:#7a1fa2; --vencBg:#f3e3fa; --chg:#7cc142; --chgBg:#e4f5d5;
  --shadow:0 1px 2px rgba(16,32,60,.06),0 4px 14px rgba(16,32,60,.06); --r:14px;
  --m1:#1d5fd0; --m2:#e8890c; --m3:#1f9d55; --m4:#7a1fa2; --m5:#d23f7a; --m6:#0e9aa7; --m7:#8a6d3b;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1220; --bg2:#111a2b; --card:#152033; --ink:#e8eef7; --ink2:#a9b7ca; --faint:#71819a; --line:#24324a; --line2:#2f405c;
  --brand:#4d8dff; --brand2:#1b2b48; --head:#0a1322; --okBg:#123524; --precBg:#3a2a10; --critBg:#3d1716; --vencBg:#2f1840; --chgBg:#1f3417;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
}}
:root[data-theme="dark"]{
  --bg:#0b1220; --bg2:#111a2b; --card:#152033; --ink:#e8eef7; --ink2:#a9b7ca; --faint:#71819a; --line:#24324a; --line2:#2f405c;
  --brand:#4d8dff; --brand2:#1b2b48; --head:#0a1322; --okBg:#123524; --precBg:#3a2a10; --critBg:#3d1716; --vencBg:#2f1840; --chgBg:#1f3417;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
body{min-height:100vh;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
@media (min-width:900px){body{padding-bottom:30px}}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.hidden{display:none!important}
/* encabezado */
header.top{position:sticky;top:0;z-index:30;background:var(--head);color:var(--headInk);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#3d82ff,#7cc142);display:grid;place-items:center;flex:none}
.logo svg{width:22px;height:22px}
.brand{height:54px;width:auto;flex:none;display:block}
.brandsep{width:1px;align-self:stretch;background:rgba(255,255,255,.18);margin:4px 2px}
@media (max-width:560px){.brand{height:34px}}
.ttl{min-width:0;flex:1;border-left:1px solid rgba(255,255,255,.18);padding-left:12px}
.ttl b{display:block;font-size:16px;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl small{display:block;color:#9fb3cf;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync{display:flex;align-items:center;gap:6px;font-size:12px;color:#b9c7da;white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:#7cc142;display:inline-block}
.sync.pend i{background:#ffb648;animation:pul 1s infinite}.sync.off i{background:#8a97aa}.sync.err i{background:#ff6b5e}.sync.local i{background:#6aa8ff}
@keyframes pul{50%{opacity:.35}}
.hbtn{width:40px;height:40px;border-radius:12px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);display:grid;place-items:center;color:#fff;flex:none}
.hbtn svg{width:20px;height:20px}
@media (max-width:560px){.sync span{display:none}}
/* pestañas */
nav.tabs{display:flex;gap:6px;padding:12px 16px 0;max-width:1280px;margin:0 auto}
nav.tabs button{border:0;background:transparent;padding:9px 14px;border-radius:10px;color:var(--ink2);font-weight:600;display:flex;align-items:center;gap:8px}
nav.tabs button.on{background:var(--card);color:var(--brand);box-shadow:var(--shadow)}
nav.tabs svg{width:18px;height:18px}
@media (max-width:899px){
  nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));gap:0;justify-content:space-around;box-shadow:0 -4px 16px rgba(0,0,0,.08)}
  nav.tabs button{flex:1;flex-direction:column;gap:3px;font-size:10.5px;padding:6px 1px;border-radius:10px;min-width:0}
  nav.tabs button.on{box-shadow:none;background:var(--brand2)}
  nav.tabs svg{width:22px;height:22px}
}
main{max-width:1280px;margin:0 auto;padding:14px 16px 20px}
h2.sec{font-size:20px;margin:6px 0 2px}
p.lead{margin:0 0 14px;color:var(--ink2);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.card h3{margin:0 0 4px;font-size:15px}
.card .sub{color:var(--faint);font-size:12.5px;margin:0 0 10px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr));align-items:start}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow);position:relative;overflow:hidden;text-align:left}
.kpi:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c,var(--brand))}
.kpi b{display:block;font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi span{color:var(--ink2);font-size:12.5px}
.kpi small{display:block;color:var(--faint);font-size:11.5px;margin-top:2px}
button.kpi{border:1px solid var(--line);width:100%}
/* controles */
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;max-width:100%}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line2);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;white-space:nowrap;color:var(--ink2);display:flex;align-items:center;gap:6px}
.chip.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.in,select.in{border:1px solid var(--line2);background:var(--card);border-radius:10px;padding:9px 11px;min-height:40px;width:100%}
.in:focus{outline:2px solid var(--brand);outline-offset:0;border-color:transparent}
.bar .in{width:auto;flex:1;min-width:140px}
.btn{border:1px solid var(--line2);background:var(--card);border-radius:10px;padding:9px 14px;font-weight:600;min-height:40px;display:inline-flex;align-items:center;justify-content:center;gap:7px}
.btn svg{width:17px;height:17px}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brandInk)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.danger{color:var(--crit);border-color:var(--crit)}
.btn.danger.full{background:var(--crit);color:#fff}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{min-height:32px;padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
/* estado */
.badge{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 9px;font-size:12px;font-weight:700;background:var(--bgc);color:var(--fc);white-space:nowrap}
.e-ok{--bgc:var(--okBg);--fc:var(--ok);--c:var(--ok)}.e-precaucion{--bgc:var(--precBg);--fc:var(--prec);--c:var(--prec)}
.e-critica{--bgc:var(--critBg);--fc:var(--crit);--c:var(--crit)}.e-vencida{--bgc:var(--vencBg);--fc:var(--venc);--c:var(--venc)}
/* tarjetas de bancas */
.bancas{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.bk{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:13px 14px;text-align:left;width:100%;position:relative;overflow:hidden}
.bk:before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:var(--c)}
.prk{position:absolute;right:10px;top:-1px;background:var(--c);color:#fff;font-size:10.5px;font-weight:800;padding:1px 7px;border-radius:0 0 7px 7px}
.bk .vac{margin-top:6px}
.bk .r1{display:flex;align-items:center;gap:10px}
.bk .num{width:46px;height:46px;border-radius:12px;background:var(--bgc);color:var(--fc);display:grid;place-items:center;font-weight:800;font-size:19px;flex:none;line-height:1}
.bk .num small{display:block;font-size:9px;font-weight:700;opacity:.8;text-align:center}
.bk .nm{min-width:0;flex:1}
.bk .nm b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bk .nm span{color:var(--faint);font-size:12px}
.bk .vac{text-align:right}
.bk .vac b{font-size:22px;font-variant-numeric:tabular-nums}
.bk .vac span{color:var(--faint);font-size:12px}
.prog{height:9px;background:var(--bg2);border-radius:99px;margin:11px 0 9px;position:relative;overflow:hidden}
.prog i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--c)}
.prog em{position:absolute;top:0;bottom:0;width:2px;background:var(--card);opacity:.9}
.bk .r3{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--ink2)}
.bk .r3 b{color:var(--ink)}
.bk .chg{margin-top:8px;font-size:12px;display:flex;align-items:center;gap:6px;color:var(--ink2)}
.tag{border-radius:6px;padding:1px 7px;font-size:11.5px;font-weight:700;background:var(--chgBg);color:#3f7d17}
.tag.sug{background:var(--brand2);color:var(--brand)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tag{color:#a6e07a}}
/* calendario */
.calwrap{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--card);max-height:70vh;box-shadow:var(--shadow)}
table.cal{border-collapse:separate;border-spacing:0;font-size:12px;font-variant-numeric:tabular-nums}
table.cal th,table.cal td{padding:0;text-align:center;border-bottom:1px solid var(--line);border-right:1px solid var(--line);white-space:nowrap}
table.cal thead th{position:sticky;top:0;background:var(--card);z-index:2;font-weight:600;color:var(--ink2);padding:4px 0;min-width:32px}
table.cal thead th.wk{background:var(--bg2)}
table.cal thead th.td{background:var(--brand);color:#fff}
table.cal thead th small{display:block;font-size:10px;font-weight:500;opacity:.8}
table.cal .fix{position:sticky;left:0;z-index:1;background:var(--card);text-align:left;padding:4px 8px;min-width:96px;max-width:120px;overflow:hidden;text-overflow:ellipsis}
table.cal thead .fix{z-index:3}
table.cal td.c{height:30px;min-width:32px;font-weight:600}
td.c.ok{background:var(--okBg);color:var(--ok)}td.c.precaucion{background:var(--precBg);color:var(--prec)}td.c.critica{background:var(--critBg);color:var(--crit)}td.c.vencida{background:var(--venc);color:#fff}
td.c.cg{background:var(--chg);color:#fff;font-weight:800;cursor:pointer}td.c.cg.sug{background:repeating-linear-gradient(45deg,var(--chg),var(--chg) 5px,#93d35d 5px,#93d35d 10px)}
td.c.td{box-shadow:inset 2px 0 0 var(--brand),inset -2px 0 0 var(--brand)}
td.c.na{background:transparent;color:var(--faint)}
.fix b{font-size:13px}.fix small{display:block;color:var(--faint);font-size:10.5px;overflow:hidden;text-overflow:ellipsis}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--ink2);margin:10px 0}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:14px;height:14px;border-radius:4px;background:var(--c);display:inline-block}
/* listas */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:10px 2px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .dt{width:52px;text-align:center;flex:none;border-radius:10px;background:var(--bg2);padding:5px 0;line-height:1.1}
.li .dt b{display:block;font-size:18px}.li .dt small{font-size:11px;color:var(--ink2);text-transform:uppercase}
.li .tx{flex:1;min-width:0}.li .tx b{display:block;font-size:14px}.li .tx span{color:var(--ink2);font-size:12.5px}
.li .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;background:var(--bg2)}
.li .ic svg{width:18px;height:18px}
.empty{text-align:center;color:var(--ink2);padding:30px 16px}
.empty b{display:block;font-size:17px;color:var(--ink);margin-bottom:6px}
/* tablas */
table.tb{width:100%;border-collapse:collapse;font-size:13px}
table.tb th{text-align:left;color:var(--faint);font-weight:600;font-size:12px;padding:6px 8px;border-bottom:1px solid var(--line)}
table.tb td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.tbw{overflow-x:auto}
/* gráficas */
svg.ch{width:100%;height:auto;display:block;overflow:visible}
svg.ch text{fill:var(--ink2);font-size:11px;font-family:inherit}
svg.ch .gl{stroke:var(--line);stroke-width:1}
.chleg{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--ink2);margin-top:8px}
.chleg span{display:flex;align-items:center;gap:5px}.chleg i{width:11px;height:11px;border-radius:3px;background:var(--c)}.wsheet{text-align:center;position:relative;overflow:hidden}
.wel{position:relative;padding:6px 4px 2px}
.wlogo{height:70px;display:block;margin:4px auto 12px}
.wel h2{font-size:26px;margin:4px 0 6px;animation:pop .6s cubic-bezier(.2,1.6,.4,1) both}
.wfr{color:var(--ink2);font-size:15px;margin:0 0 16px}
.wchips{display:grid;gap:8px;text-align:left}
.wchip{display:flex;gap:10px;align-items:center;background:var(--bg2);border-radius:12px;padding:10px 12px;border-left:4px solid var(--c);font-size:14px;animation:sube .5s both}
.wchip:nth-child(2){animation-delay:.08s}.wchip:nth-child(3){animation-delay:.16s}.wchip:nth-child(4){animation-delay:.24s}
.wchip span{font-size:22px}
.wgo{width:100%;margin-top:16px;font-size:17px;min-height:50px}
.confeti{position:absolute;inset:-20px 0 auto 0;height:100%;pointer-events:none}
.confeti i{position:absolute;top:-14px;width:8px;height:12px;border-radius:2px;opacity:.9;animation:cae 2.4s ease-in forwards}
@keyframes cae{to{top:105%;opacity:0;transform:rotate(540deg)}}
@keyframes pop{from{transform:scale(.6);opacity:0}}
@keyframes sube{from{transform:translateY(12px);opacity:0}}
.ptb{margin:6px 0 4px;font-size:12.5px}.ptb th{padding:4px 6px;font-size:11px}.ptb td{padding:5px 6px}.ptb tr.lim td{background:var(--critBg)}.ptb tr.cj td{background:var(--bg2)}.ptb tr.tz td{background:var(--okBg);color:var(--ok);font-size:13px}.ptb small{color:var(--faint);font-weight:400}
.pgrid{margin-top:12px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.pgh,.pgr{display:grid;grid-template-columns:1fr 64px 150px;gap:8px;align-items:center;padding:8px 10px}
.pgh{background:var(--bg2);font-size:11.5px;font-weight:700;color:var(--ink2)}
.pgr{border-top:1px solid var(--line)}.pgr small{display:block;color:var(--faint);font-size:11px}.pgr.juego{background:var(--brand2)}
.pst{font-weight:700;font-variant-numeric:tabular-nums;text-align:center}
.pin{display:flex;gap:6px;align-items:center}.pin .in{min-width:0;font-weight:700}.pin .chip{padding:5px 8px}
.invg{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.ivc{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;border-top:4px solid var(--c)}
.ivh{display:flex;align-items:center;gap:8px}.ivh b{flex:1;font-size:15px}.ivh .dot{width:12px;height:12px;border-radius:4px;flex:none}
.ivn{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0 4px}.ivn small{display:block;color:var(--ink2);font-size:11.5px}.ivn b{font-size:24px;font-variant-numeric:tabular-nums}
.ivt{margin:4px 0 0;font-size:12.5px;color:var(--ink2)}
.top5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:4px 0 12px}
@media (max-width:700px){.top5{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:150px;overflow-x:auto;padding-bottom:4px}}
.t5{border:1px solid var(--line);border-top:4px solid var(--c);background:var(--card);border-radius:12px;padding:8px 10px;text-align:left;display:flex;flex-direction:column;gap:1px;position:relative;min-width:0}
.t5 .rk{position:absolute;right:8px;top:6px;width:22px;height:22px;border-radius:50%;background:var(--c);color:#fff;font-weight:800;font-size:12px;display:grid;place-items:center}
.t5 b{font-size:18px}.t5 small{color:var(--ink2);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.t5 em{font-style:normal;font-weight:700;color:var(--fc);font-size:12.5px}
.tip{position:fixed;z-index:80;background:var(--head);color:#fff;font-size:12px;padding:6px 9px;border-radius:8px;pointer-events:none;max-width:240px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
/* modal */
.ov{position:fixed;inset:0;z-index:60;background:rgba(8,14,26,.55);display:flex;align-items:flex-end;justify-content:center;animation:fi .15s}
@media (min-width:700px){.ov{align-items:center;padding:24px}}
@keyframes fi{from{opacity:0}}
.sheet{background:var(--card);width:100%;max-width:760px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));animation:su .2s}
@media (min-width:700px){.sheet{border-radius:20px}}
.sheet.sm{max-width:480px}
@keyframes su{from{transform:translateY(30px);opacity:.4}}
.sh{display:flex;align-items:flex-start;gap:12px;margin-bottom:12px}
.sh h3{margin:0;font-size:19px}.sh p{margin:2px 0 0;color:var(--ink2);font-size:13px}
.x{margin-left:auto;width:38px;height:38px;border-radius:50%;border:0;background:var(--bg2);font-size:20px;line-height:1;flex:none}
label.f{display:block;font-size:12.5px;font-weight:700;color:var(--ink2);margin:12px 0 5px}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:120px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.acts .grow{flex:1}
.note{border-radius:10px;padding:10px 12px;font-size:13px;background:var(--brand2);color:var(--ink);margin:10px 0}
.note.bad{background:var(--critBg);color:var(--crit)}.note.ok{background:var(--okBg);color:var(--ok)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:6px 0 14px}
.st{background:var(--bg2);border-radius:12px;padding:10px 12px}
.st span{display:block;color:var(--ink2);font-size:12px}.st b{font-size:20px;font-variant-numeric:tabular-nums}.st small{color:var(--faint);font-size:11.5px;display:block}
.tbtns{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:14px 0}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--head);color:#fff;padding:10px 16px;border-radius:12px;z-index:90;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.3);max-width:92vw;text-align:center;animation:su .2s}
@media (min-width:900px){.toast{bottom:28px}}
/* acceso */
.login{position:fixed;inset:0;z-index:70;background:radial-gradient(1200px 600px at 20% -10%,#24477e,transparent),linear-gradient(160deg,#0f1b2d,#0a1322);display:grid;place-items:center;padding:20px;overflow:auto}
.lbox{width:100%;max-width:380px;background:var(--card);border-radius:20px;padding:24px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.lbox .logo{width:52px;height:52px;border-radius:15px;margin-bottom:12px}.lbox .logo svg{width:30px;height:30px}
.lbox h1{font-size:21px;margin:0}.lbox p{color:var(--ink2);font-size:13.5px;margin:4px 0 8px}
.lnk{border:0;background:none;color:var(--brand);font-weight:600;padding:6px 0;text-decoration:underline}
.chkl{display:flex;gap:9px;align-items:flex-start;margin:14px 0 0;font-size:13.5px;color:var(--ink2);line-height:1.4}.chkl input{width:20px;height:20px;flex:none;margin:0}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}
.pill{display:inline-block;background:var(--bg2);border-radius:6px;padding:1px 6px;font-size:12px;font-weight:600}
.spin{width:36px;height:36px;border-radius:50%;border:3px solid rgba(255,255,255,.2);border-top-color:#7cc142;animation:rot 1s linear infinite;margin:0 auto 12px}
@keyframes rot{to{transform:rotate(360deg)}}
@media print{header.top,nav.tabs,.bar,.acts,.btn{display:none!important}body{background:#fff;padding:0}.card,.kpi{box-shadow:none}}

.cnt{font-style:normal;background:var(--crit);color:#fff;border-radius:99px;padding:0 6px;font-size:10px;font-weight:800;margin-left:2px}
.famk{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;margin-bottom:14px}
.fk{background:var(--card);border:1px solid var(--line);border-top:5px solid var(--c);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 14px;text-align:left}
.fk.on{outline:2px solid var(--c)}
.fkh{display:flex;align-items:center;gap:8px;font-size:16px}.fkh span{font-size:22px}
.fkn{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:10px 0 6px}.fkn small{display:block;color:var(--ink2);font-size:11px}.fkn b{font-size:22px;font-variant-numeric:tabular-nums}
.fki{font-size:12.5px;color:var(--prec);font-weight:700}.fki.ok{color:var(--ok);font-weight:600}
.ftab{margin-top:14px;border-top:4px solid var(--c)}
table.it td,table.it th{vertical-align:middle}
table.it .num{text-align:center}
table.it tbody tr{cursor:pointer}table.it tbody tr:hover td{background:var(--bg2)}
table.it tfoot td{border-top:2px solid var(--line2);background:var(--bg2)}
.pn{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;font-weight:700;color:var(--brand)}
.et{display:inline-block;border-radius:6px;padding:1px 7px;background:var(--c);color:#fff;font-size:11.5px}
table.it th small{display:block;font-weight:500;font-size:10.5px;margin-top:2px}
.cv{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums}.cero{color:var(--faint);font-weight:400}
.act{display:block;color:var(--faint);font-size:11px;font-weight:400}
@media (max-width:700px){
  table.it thead{display:none}table.it,table.it tbody,table.it tfoot,table.it tr{display:block;width:100%}
  table.it tr{display:grid;grid-template-columns:repeat(5,1fr);gap:4px 6px;padding:10px 4px;border-bottom:1px solid var(--line)}
  table.it td{border:0;padding:0}
  table.it td:nth-child(1){grid-column:1/3}table.it td:nth-child(2){grid-column:1/6;grid-row:2}
  table.it td:nth-child(1)~td.num{grid-row:3;text-align:center}
  table.it td.num:before{display:block;font-size:10.5px;color:var(--ink2);font-weight:600}
  table.it td:nth-child(3):before{content:"WIP 1"}table.it td:nth-child(4):before{content:"WIP 2"}table.it td:nth-child(5):before{content:"FG"}table.it td:nth-child(6):before{content:"Total"}table.it td:nth-child(7):before{content:"Incompl."}
  table.it tfoot tr td:first-child{grid-column:1/6;grid-row:1}
  table.it tfoot td.num{grid-row:2!important;grid-column:auto!important;text-align:center;background:var(--bg2);border-radius:8px;padding:4px 0}
  table.it tfoot tr td:first-child{background:none}
  table.it tfoot td:nth-child(2):before{content:"WIP 1"}table.it tfoot td:nth-child(3):before{content:"WIP 2"}table.it tfoot td:nth-child(4):before{content:"FG"}table.it tfoot td:nth-child(5):before{content:"Total"}table.it tfoot td:nth-child(6):before{content:"Incompl."}
}
.flujo{display:flex;align-items:stretch;gap:6px;margin:4px 0 10px}
.fl-e{flex:1;background:var(--bg2);border-radius:12px;padding:8px 6px;text-align:center;border-top:4px solid var(--c)}
.fl-e small{display:block;font-weight:800;color:var(--c)}.fl-e b{display:block;font-size:26px;font-variant-numeric:tabular-nums}.fl-e span{font-size:11px;color:var(--ink2)}
.fl-ar{align-self:center;color:var(--faint);font-size:18px}
.h4{margin:16px 0 6px;font-size:14px}
.qmov{display:grid;gap:6px}
.qm{display:flex;align-items:center;gap:10px;justify-content:space-between;background:var(--bg2);border-radius:10px;padding:6px 8px 6px 12px;font-size:13.5px}
.stp{display:flex;gap:6px;flex:0 0 auto}.stp .in{width:76px;min-height:36px;padding:5px 8px;font-weight:700}
.stp2{display:flex;gap:4px}.stp2 .in{text-align:center;font-weight:800;font-size:17px;min-width:0}.stp2 .btn{flex:0 0 38px;font-size:18px;padding:0}
.incg{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.incc{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 14px;display:flex;flex-direction:column;gap:3px}
.ich{display:flex;justify-content:space-between;align-items:center}
.ifa{color:var(--crit);font-size:13.5px}.icom{margin:4px 0 0;font-size:13px;background:var(--bg2);border-radius:8px;padding:6px 8px}
.donas{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:6px}
.clave .in#pp{font-size:20px;letter-spacing:4px;text-align:center}
.shake{animation:shk .35s}@keyframes shk{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
</style>
</head>

function almacenNube(db){

    listen:function(c, f){ col(c).onSnapshot(function(snap){ var o = {}; snap.forEach(function(d){ o[d.id] = d.data(); }); f(o); }, function(e){ console.error(e); if(e && e.code === "permission-denied") sinPermiso(); else setSync("err"); }); },
    lote:function(ops){ var gr = []; for(var i = 0; i < ops.length; i += 400) gr.push(ops.slice(i, i + 400));
      return track(Promise.all(gr.map(function(g){ var b = db.batch(); g.forEach(function(o){ var r = col(o[0]).doc(o[1]); if(o[3] === "del") b.delete(r); else b.set(r, limpio(o[2])); }); return b.commit(); }))); },
    reemplazar:function(nv){ var ops = []; COLS.forEach(function(c){ var cur = c === "items" ? S.items : c === "inc" ? S.inc : c === "movs" ? S.movs : {general:1}; Object.keys(cur).forEach(function(id){ if(!nv[c] || !nv[c][id]) ops.push([c, id, null, "del"]); }); Object.keys(nv[c] || {}).forEach(function(id){ ops.push([c, id, nv[c][id]]); }); }); return this.lote(ops); }

function sha(txt){

    '<div class="acts"><button class="btn" id="cadd">+ Agregar persona</button></div>' +
    '<h4 class="h4">⚠️ Partes que pueden faltar</h4><p class="sub">Opciones al registrar un incompleto, separadas por coma.</p>' + Object.keys(FAM).map(function(f){ return '<label class="f">' + FAM[f].n + '</label><input class="in" data-ff="' + f + '" value="' + esc(faltantesDe(f).join(", ")) + '" placeholder="Ej. Cuerpo, Tapa">'; }).join("") +
    '<div class="acts"><button class="btn" id="fsave">🔒 Guardar partes</button></div>' +
    '<h4 class="h4">📋 Catálogo</h4><div class="acts" style="margin-top:0"><button class="btn" id="pnadd">+ Agregar número de parte</button></div>' +
    '<h4 class="h4">💾 Respaldo</h4><div class="acts" style="margin-top:0"><button class="btn" data-act="respaldo">Descargar respaldo (.json)</button><button class="btn" data-act="csv">Inventario a Excel (CSV)</button></div>' +
    '<h4 class="h4">Conexión</h4>' + (S.modo === "nube" ? '<p class="sub">Conectado como <b>' + esc(S.nombre) + '</b>. Los cambios se ven en tiempo real en todos los dispositivos.</p><div class="acts"><button class="btn" data-act="salir">Cerrar sesión</button></div>' : '<p class="sub">Usando solo este dispositivo.</p><div class="acts"><button class="btn pri" data-act="anube">Entrar con usuario (nube)</button></div>') ;
  var sh = modal(h, "sm");
  $("#cadd", sh).addEventListener("click", function(){ formPersona(null); });
  sh.addEventListener("click", function(e){ var b;
    if((b = e.target.closest("[data-cpw]"))) formPersona(+b.dataset.cpw);
    if((b = e.target.closest("[data-cdel]"))){ var i = +b.dataset.cdel, c = cs[i]; pedirClave("Quitar a " + c.n, "Solo un supervisor puede quitar personas.", function(quien){ var nl = capturistas(); nl.splice(i, 1); DB.lote([["config", "general", Object.assign({}, S.cfg, {capturistas:nl})], movOp({tipo:"config", txt:"Se quitó a " + c.n + " de las personas autorizadas"}, quien)]).then(function(){ toast("Listo"); hojaAjustes(); }); }, true); }
  });
  $("#fsave", sh).addEventListener("click", function(){ var fal = {}; $$("[data-ff]", sh).forEach(function(i){ fal[i.dataset.ff] = i.value.split(",").map(function(x){ return x.trim(); }).filter(Boolean); });
    pedirClave("Guardar partes que pueden faltar", "", function(quien){ DB.lote([["config", "general", Object.assign({}, S.cfg, {faltantes:fal})], movOp({tipo:"config", txt:"Se actualizaron las partes que pueden faltar"}, quien)]).then(function(){ toast("Guardado"); }); }); });
  $("#pnadd", sh).addEventListener("click", formPN);
}
function formPersona(idx){
  var c = idx == null ? null : capturistas()[idx];
  var h = '<div class="sh"><div><h3>' + (c ? "Cambiar contraseña de " + esc(c.n) : "Agregar persona") + '</h3><p>' + (c ? "" : "Podrá confirmar cambios con su propia contraseña.") + '</p></div><button class="x" data-x>×</button></div>' +
    (c ? '' : '<label class="f">Nombre</label><input class="in" id="fn" placeholder="Ej. Juan (turno 2)"><label class="chkl"><input type="checkbox" id="fsup"> <span>Es supervisor (puede agregar o quitar personas)</span></label>') +
    '<div class="row"><div><label class="f">Contraseña nueva</label><input class="in" type="password" id="f1" autocomplete="new-password"></div><div><label class="f">Repítela</label><input class="in" type="password" id="f2" autocomplete="new-password"></div></div><div id="ferr"></div>' +
    '<div class="acts"><button class="btn pri grow" id="fok">Continuar</button></div><p class="sub">Después te pediremos la contraseña de un supervisor para autorizarlo.</p>';
  var sh = modal(h, "sm");
  $("#fok", sh).addEventListener("click", function(){ var nm = c ? c.n : $("#fn", sh).value.trim(), a = $("#f1", sh).value, b = $("#f2", sh).value, sup = c ? c.sup : $("#fsup", sh).checked;
    if(!nm || a.length < 4){ $("#ferr", sh).innerHTML = '<div class="note bad">Escribe un nombre y una contraseña de al menos 4 caracteres.</div>'; return; }
    if(a !== b){ $("#ferr", sh).innerHTML = '<div class="note bad">Las contraseñas no coinciden.</div>'; return; }
    if(!c && capturistas().some(function(x){ return x.n.toLowerCase() === nm.toLowerCase(); })){ $("#ferr", sh).innerHTML = '<div class="note bad">Ya existe una persona con ese nombre.</div>'; return; }
    hashDe(nm, a).then(function(hh){ pedirClave("Autorizar a " + nm, "Se necesita la contraseña de un supervisor.", function(quien){
      var nl = capturistas(); if(c) nl[idx] = Object.assign({}, c, {h:hh}); else nl.push({n:nm, h:hh, sup:sup});
      DB.lote([["config", "general", Object.assign({}, S.cfg, {capturistas:nl})], movOp({tipo:"config", txt:(c ? "Cambio de contraseña de " : "Nueva persona autorizada: ") + nm}, quien)]).then(function(){ toast("Listo: " + nm); hojaAjustes(); }); }, true); }); });
}
function formPN(){
  var h = '<div class="sh"><div><h3>Agregar número de parte</h3></div><button class="x" data-x>×</button></div><label class="f">Part name</label><input class="in" id="ppn" placeholder="Ej. MOL116P4"><label class="f">Modelo</label><input class="in" id="pnm" placeholder="Ej. Taza Redonda NH"><label class="f">Familia</label><select class="in" id="pfa">' + Object.keys(FAM).map(function(f){ return '<option value="' + f + '">' + FAM[f].n + '</option>'; }).join("") + '</select><div class="acts"><button class="btn pri grow" id="pok2">🔒 Agregar</button></div>';
  var sh = modal(h, "sm");
  $("#pok2", sh).addEventListener("click", function(){ var pn = $("#ppn", sh).value.trim().toUpperCase().replace(/[\/\s]+/g, "-"), nm = $("#pnm", sh).value.trim(), fa = $("#pfa", sh).value;
    if(!pn || !nm){ toast("Falta el part name o el modelo"); return; } if(S.items[pn]){ toast("Ese número de parte ya existe"); return; }
    pedirClave("Agregar " + pn, esc(nm) + " · " + FAM[fa].n, function(quien){ DB.lote([["items", pn, {nombre:nm, fam:fa, wip1:0, wip2:0, fg:0, orden:Date.now()}], movOp({tipo:"config", pn:pn, nombre:nm, txt:"Número de parte agregado"}, quien)]).then(function(){ toast("Agregado"); cerrarModal(); render(); }); }); });
}

/* ---------- exportar ---------- */
function descargar(nombre, contenido, tipo){ var b = new Blob([contenido], {type:tipo}), a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = nombre; document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 500); }
function csv(f){ return "﻿" + f.map(function(r){ return r.map(function(x){ x = x == null ? "" : String(x); return /[",;\n]/.test(x) ? '"' + x.replace(/"/g, '""') + '"' : x; }).join(","); }).join("\r\n"); }
function csvInv(){ var f = [["GESTIÓN DE INVENTARIOS", "", hoy()], []];
  Object.keys(FAM).forEach(function(fa){ f.push(["PART NAME", "MODELOS", FAM[fa].n.toUpperCase() + " FALTA DE SECADO (WIP 1)", FAM[fa].n.toUpperCase() + " DENTRO DEL SECADOR (WIP 2)", FAM[fa].n.toUpperCase() + " LISTOS (FG)", "TOTAL", "INCOMPLETOS"]);
    itemsLista().filter(function(it){ return it.fam === fa; }).forEach(function(it){ f.push([it.id, it.nombre, +it.wip1 || 0, +it.wip2 || 0, +it.fg || 0, tot(it), cantInc(it.id)]); }); var s = sumaFam(fa); f.push(["", "TOTAL", s.wip1, s.wip2, s.fg, s.tot, s.inc]); f.push([]); });
  f.push(["INCOMPLETOS ABIERTOS"]); f.push(["Part name", "Modelo", "Cantidad", "Etapa", "Le falta", "Comentario", "Registró", "Fecha"]);
  incAbiertos().forEach(function(x){ var it = S.items[x.pn] || {}; f.push([x.pn, it.nombre, x.cant, ETN[x.etapa] || "", faltTxt(x), x.com, x.por, fHora(x.ts)]); });
  descargar("inventario-tazas-anillos-tanques-" + hoy() + ".csv", csv(f), "text/csv;charset=utf-8"); }
function csvHist(){ var f = [["Fecha y hora", "Tipo", "Part name", "Modelo", "Antes WIP1", "Antes WIP2", "Antes FG", "Después WIP1", "Después WIP2", "Después FG", "Detalle", "Comentario", "Confirmó", "Cuenta"]];
  Object.keys(S.movs).map(function(k){ return S.movs[k]; }).sort(function(a, b){ return a.ts - b.ts; }).forEach(function(m){ var a = m.antes || {}, d = m.despues || {}; f.push([new Date(m.ts).toLocaleString("es-MX"), TIPM[m.tipo] || m.tipo, m.pn || "", m.nombre || "", a.wip1, a.wip2, a.fg, d.wip1, d.wip2, d.fg, m.txt || "", m.nota || "", m.por || "", m.usuario || ""]); });
  descargar("historial-inventario-" + hoy() + ".csv", csv(f), "text/csv;charset=utf-8"); }
var toastT;
function toast(t){ var el = $(".toast"); if(el) el.remove(); el = document.createElement("div"); el.className = "toast"; el.textContent = t; document.body.appendChild(el); clearTimeout(toastT); toastT = setTimeout(function(){ el.remove(); }, 3200); }
var tipEl = null;
document.addEventListener("pointermove", function(e){ var t = e.target.closest && e.target.closest("[data-tip]"); if(t){ if(!tipEl){ tipEl = document.createElement("div"); tipEl.className = "tip"; document.body.appendChild(tipEl); } tipEl.innerHTML = t.getAttribute("data-tip"); tipEl.hidden = false; var x = e.clientX + 12; if(x + 240 > innerWidth) x = e.clientX - 250; tipEl.style.left = x + "px"; tipEl.style.top = (e.clientY + 12) + "px"; } else if(tipEl) tipEl.hidden = true; });

/* ---------- eventos ---------- */
document.addEventListener("click", function(e){
  var t;
  if((t = e.target.closest("[data-tab]"))){ S.tab = t.dataset.tab; LS.set("iv_tab", S.tab); render(); scrollTo(0, 0); return; }
  if((t = e.target.closest("[data-act]"))){ var a = t.dataset.act;
    if(a === "cargar") cargarCatalogo(); else if(a === "incnuevo") formIncompleto(t.dataset.pn || ""); else if(a === "csv") csvInv(); else if(a === "csvhist") csvHist(); else if(a === "imprimir") print();
    else if(a === "respaldo") descargar("respaldo-inventario-" + hoy() + ".json", JSON.stringify({app:"inventario-etapas", fecha:new Date().toISOString(), config:{general:S.cfg}, items:S.items, inc:S.inc, movs:S.movs}, null, 1), "application/json");
    else if(a === "salir"){ cerrarModal(); LS.set("iv_modo", "nube"); fb.auth.signOut(); }
    else if(a === "anube"){ cerrarModal(); LS.set("iv_modo", "nube"); location.reload(); }
    return; }
  if(e.target.closest(".ov")){
    if((t = e.target.closest("[data-incedit]"))) formIncompleto("", t.dataset.incedit);
    return; }
  if((t = e.target.closest("[data-item]"))){ abrirItem(t.dataset.item); return; }
  if((t = e.target.closest("[data-fam]"))){ S.fam = S.fam === t.dataset.fam && t.classList.contains("fk") ? "todas" : t.dataset.fam; LS.set("iv_fam", S.fam); render(); return; }
  if((t = e.target.closest("[data-hf]"))){ S.hf = t.dataset.hf; render(); return; }
  if((t = e.target.closest("[data-et]"))){ S.et = t.dataset.et; render(); return; }
  if((t = e.target.closest("[data-incedit]"))){ formIncompleto("", t.dataset.incedit); return; }
  if((t = e.target.closest("[data-incres]"))){ resolverInc(t.dataset.incres); return; }
});
document.addEventListener("input", function(e){ if(e.target.id === "fq"){ S.q = e.target.value; var p = e.target.selectionStart; renderYa(); var q = $("#fq"); if(q){ q.focus(); try{ q.setSelectionRange(p, p); }catch(er){} } } });
$("#btnCfg").addEventListener("click", hojaAjustes);
function cargarCatalogo(){
  pedirClave("Cargar catálogo del Excel", "Se crearán los 16 números de parte con cantidades en 0.", function(quien){
    var ops = CATALOGO.map(function(r, i){ return ["items", r[0], {nombre:r[1], fam:r[2], wip1:0, wip2:0, fg:0, orden:i}]; });
    ops.push(movOp({tipo:"config", txt:"Se cargó el catálogo del Excel (16 números de parte)"}, quien));
    DB.lote(ops).then(function(){ toast("Catálogo cargado ✓"); });
  });
}

/* ============================================================
   ARRANQUE
   ============================================================ */
var fb = null;
function conectar(store){
  DB = store; S.modo = store.tipo; syncUI();
  DB.listen("config", function(o){ S.cfg = o.general || {}; S.listo.config = true; render(); });
  DB.listen("items", function(o){ S.items = o; S.listo.items = true; render(); });
  DB.listen("inc", function(o){ S.inc = o; render(); });
  DB.listen("movs", function(o){ S.movs = o; if(S.tab === "historial" || S.tab === "graficas") render(); });
  $("#login").classList.add("hidden");
}
function modoLocal(){ LS.set("iv_modo", "local"); S.nombre = ""; conectar(almacenLocal()); }
function pantallaLogin(msg){
  $("#login").classList.remove("hidden");
  $("#lbox").innerHTML = '<img src="' + LOGO_AZUL + '" alt="Gerber" style="height:64px;display:block;margin:0 auto 14px"><h1 style="text-align:center">Inventario de Moldes</h1><p style="text-align:center">Tazas, anillos y tanques · WIP 1, WIP 2 y FG</p>' +
    (msg ? '<div class="note bad">' + esc(msg) + '</div>' : '') +
    (fb ? '<form id="lf"><label class="f">Usuario</label><input class="in" id="lu" autocomplete="username" autocapitalize="none" placeholder="ej. ignacio" required><label class="f">Contraseña</label><input class="in" id="lp" type="password" autocomplete="current-password" required><div class="acts"><button class="btn pri grow" type="submit" id="lb">Entrar</button></div></form>'
      : '<div class="note">No se pudo conectar con la nube.</div><div class="acts"><button class="btn pri grow" onclick="location.reload()">Reintentar</button></div>') +
    '<p style="margin-top:14px;font-size:12.5px">¿Sin internet? <button class="lnk" id="loc">Usar solo en este dispositivo</button></p>';
  var lf = $("#lf"); if(lf) lf.addEventListener("submit", function(e){ e.preventDefault(); var u = $("#lu").value.trim().toLowerCase(), p = $("#lp").value, b = $("#lb"); b.disabled = true; b.textContent = "Entrando…";
    fb.auth.signInWithEmailAndPassword(u.indexOf("@") >= 0 ? u : u + "@" + DOMINIO, p).catch(function(er){ var c = er && er.code || ""; pantallaLogin(/invalid|wrong|not-found|user/.test(c) ? "Usuario o contraseña incorrectos." : /network/.test(c) ? "Sin conexión a internet." : "No se pudo entrar (" + c + ")."); }); });
  $("#loc").onclick = modoLocal;
}
function cargarScript(src){ return new Promise(function(ok, bad){ var s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = bad; document.head.appendChild(s); }); }
(function iniciar(){
  var t = LS.get("iv_tema", ""); if(t) document.documentElement.setAttribute("data-theme", t);
  if(LS.get("iv_modo", "") === "local"){ modoLocal(); return; }
  var base = "https://www.gstatic.com/firebasejs/" + FBV + "/", hecho = false, tmo = setTimeout(function(){ if(!hecho){ hecho = true; pantallaLogin(); } }, 9000);
  cargarScript(base + "firebase-app-compat.js").then(function(){ return Promise.all([cargarScript(base + "firebase-auth-compat.js"), cargarScript(base + "firebase-firestore-compat.js")]); }).then(function(){
    if(hecho) return; hecho = true; clearTimeout(tmo);
    if(!firebase.apps.length) firebase.initializeApp(FB_CFG);
    fb = {auth:firebase.auth(), db:firebase.firestore()}; try{ fb.db.enablePersistence({synchronizeTabs:true}).catch(function(){}); }catch(e){}
    var con = false;
    fb.auth.onAuthStateChanged(function(u){ if(u){ S.user = u; S.nombre = (u.email || "").split("@")[0]; if(!con){ con = true; conectar(almacenNube(fb.db)); } } else { if(con){ location.reload(); return; } pantallaLogin(); } });
  }, function(){ if(hecho) return; hecho = true; clearTimeout(tmo); pantallaLogin(); });
})();
window.INV = {S:S, render:renderYa};
})();

</script>
